name: Build realme GT3 Kernel SukiSU+KPM (repo manifest)

# Cloud-build realme GT3 / GT neo5 (sm8550 waipio) GKI android12-5.10 kernel
# with SukiSU Ultra + SUSFS + CONFIG_KPM=y.
# Based on Quantom2/Realme-GT3-neo5-kernels proven build flow (repo manifest
# + oplus_build_kernel.sh), which syncs the FULL kernel_platform incl. oplus
# private modules (single git clone of open-source repo is incomplete).
#
# Usage: push to .github/workflows/, Actions -> Run workflow -> download zip.

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: 'SukiSU ref (susfs-main / latest / commit)'
        required: false
        default: 'susfs-main'
      susfs_branch:
        description: 'susfs4ksu branch'
        required: false
        default: 'gki-android12-5.10'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install deps + repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl bc bison flex libssl-dev libelf-dev \
            python3 python3-pip make cpio unzip zip rsync ccache repo \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu libncurses-dev \
            lz4 zstd device-tree-compiler
          if ! command -v repo >/dev/null; then
            curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
            chmod a+x ~/repo; sudo mv ~/repo /usr/local/bin/repo
          fi

      - name: Sync kernel_platform (full, via manifest)
        run: |
          # manifest paths are prefixed with kernel_platform/, so init in ~
          # to get ~/kernel_platform/{common,vendor,...} directly.
          cd ~
          repo init -u https://github.com/Quantom2/gt_neo5_kernel_manifest.git \
            -b oneplus/sm8475 -m realme_gt_neo5.xml --depth=1 --no-tags
          ok=0
          for i in 1 2 3; do
            if repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc); then ok=1; break; fi
            echo "repo sync attempt $i failed; retry"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::repo sync failed"; exit 1; }
          echo "=== layout ==="; ls ~/kernel_platform
          echo "=== drivers ==="; find ~/kernel_platform -maxdepth 3 -type d -name drivers 2>/dev/null | head

      - name: Integrate SukiSU Ultra
        run: |
          cd ~/kernel_platform
          echo "=== kernel_platform layout ==="; ls -la
          echo "=== find drivers dirs ==="; find . -maxdepth 2 -type d -name drivers 2>/dev/null
          # setup.sh needs cwd containing drivers/ or common/drivers.
          # GKI tree is usually common/. Pick the dir that has drivers/.
          if [ -d common/drivers ]; then ROOT=~/kernel_platform/common;
          elif [ -d drivers ]; then ROOT=~/kernel_platform;
          else ROOT=~/kernel_platform/common; fi
          echo "using ROOT=$ROOT"
          cd "$ROOT"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${{ github.event.inputs.sukisu_ref }}"
          # version stamp (KernelSU cloned under $ROOT)
          if [ -d "$ROOT/KernelSU/kernel" ]; then
            cd "$ROOT/KernelSU/kernel"
            BASE=10606
            V=$(expr $(git rev-list --count HEAD 2>/dev/null || echo 0) + $BASE)
            sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${V}/" Makefile || true
          fi

      - name: Apply SUSFS patches
        run: |
          cd ~/kernel_platform
          git clone https://github.com/WildPlusKernel/kernel_patches.git --depth=1 --no-tags || \
          git clone https://github.com/WildKernels/kernel_patches.git --depth=1 --no-tags
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "${{ github.event.inputs.susfs_branch }}" --depth=1 --no-tags || \
          git clone https://github.com/sidex15/susfs4ksu.git -b "${{ github.event.inputs.susfs_branch }}" --depth=1 --no-tags
          cp -r susfs4ksu/kernel_patches/fs/* common/fs/ 2>/dev/null || true
          cp -r susfs4ksu/kernel_patches/include/* common/include/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch common/ 2>/dev/null || true
          cp kernel_patches/69_hide_stuff.patch common/ 2>/dev/null || true
          cd common
          patch -p1 < 50_add_susfs_in_gki-android12-5.10.patch || echo "susfs patch skip"
          patch -p1 --fuzz=3 -F3 < 69_hide_stuff.patch || echo "hide patch skip"

      - name: Configure KSU + SUSFS + KPM
        run: |
          cd ~/kernel_platform
          CFG=./common/arch/arm64/configs/gki_defconfig
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPM=y"
            echo "CONFIG_KALLSYMS=y"
            echo "CONFIG_KALLSYMS_ALL=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
            echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n"
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_SU=n"
            echo "CONFIG_MODULE_SIG=n"
          } >> "$CFG"
          sed -i 's/check_defconfig//' ./common/build.config.gki || true
          rm -f common/android/gki_aarch64_modules; touch common/android/gki_aarch64_modules
          echo "=== KPM in defconfig ==="; grep -E "CONFIG_KPM|CONFIG_KSU=" "$CFG"

      - name: Prepare oplus build script
        run: |
          cd ~/kernel_platform/oplus/build/
          sed -i '/init_environment/s/ \$1 \$2/ \$1 \$2 \$3 \$4 \$5/' oplus_build_kernel.sh || true
          sed -i '/oplus_setup.sh/s/ \$1 \$2/ \$1 \$2 \$3 \$4 \$5/' oplus_build_kernel.sh || true

      - name: Build kernel Image
        run: |
          cd ~
          SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh wapio gki thin all disable 2>&1 | tee build.log
          echo "=== find Image ==="
          find ~/kernel_platform/out -name Image 2>/dev/null | head
          IMG=$(find ~/kernel_platform/out -path "*gki_kernel/dist/Image" 2>/dev/null | head -1)
          [ -z "$IMG" ] && IMG=$(find ~/kernel_platform/out -name Image 2>/dev/null | head -1)
          echo "IMG=$IMG"; ls -l "$IMG"
          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV

      - name: Package AnyKernel3
        run: |
          cd ~
          git clone https://github.com/WildPlusKernel/AnyKernel3.git -b gki-2.0 --depth=1 --no-tags || \
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          cp "$IMAGE_PATH" AnyKernel3/Image
          sed -i 's/do.devicecheck=.*/do.devicecheck=0/' AnyKernel3/anykernel.sh || true
          cd AnyKernel3
          zip -r9 ~/GT3-SukiSU-KPM.zip ./* -x "*.git*"
          ls -l ~/GT3-SukiSU-KPM.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GT3-SukiSU-KPM
          path: ~/GT3-SukiSU-KPM.zip